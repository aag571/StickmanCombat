<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{{ PRODUCT_NAME }}}</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
    #game { position: fixed; inset: 0; height: 100dvh; }
    body { overscroll-behavior: none; -webkit-user-select: none; user-select: none; }
    #orientation { display: none; position: absolute; bottom: max(10px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); padding: 6px 12px; color: #fff; background: #000b; border-radius: 6px; pointer-events: none; white-space: nowrap; font-size: 13px; }
    @media (pointer: coarse) and (orientation: portrait) { #orientation { display: block; } }
    #canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #loading { position: absolute; inset: 0; display: grid; place-content: center; gap: 16px; color: white; text-align: center; background: #101018; }
    progress { width: min(70vw, 320px); }
    #loadingHint { color: #b9becb; font-size: 14px; }
    #retry { display: none; justify-self: center; padding: 8px 22px; border: 1px solid #ffffff60; border-radius: 6px; color: white; background: #0009; cursor: pointer; }
    #fullscreen { position: absolute; top: max(12px, env(safe-area-inset-top)); right: max(12px, env(safe-area-inset-right)); padding: 8px 14px; border: 1px solid #ffffff60; border-radius: 6px; color: white; background: #0009; cursor: pointer; }
    #error { max-width: 80vw; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div id="game">
    <canvas id="canvas" tabindex="0"></canvas>
    <div id="orientation">寤鸿妯睆娓哥帺 路 宸﹀彸涓嬭鎸夐挳鎿嶄綔</div>
    <div id="loading"><span>姝ｅ湪鍔犺浇娓告垙鈥?/span><progress id="progress" max="1" value="0"></progress><div id="error" role="alert"></div></div>
    <button id="fullscreen" type="button" disabled>鍏ㄥ睆</button>
  </div>
  <script>
    const canvas = document.getElementById('canvas');
    const fullscreen = document.getElementById('fullscreen');
    const loading = document.getElementById('loading');
    const error = document.getElementById('error');
    const loadingHint = document.createElement('span');
    loadingHint.id = 'loadingHint';
    loadingHint.textContent = '棣栨鍔犺浇鍙兘浼氭參涓€鐐癸紝璧勬簮浼氱紦瀛樺埌鏈満';
    loading.appendChild(loadingHint);
    const retry = document.createElement('button');
    retry.id = 'retry';
    retry.type = 'button';
    retry.textContent = '閲嶆柊鍔犺浇';
    retry.addEventListener('click', () => window.location.reload());
    loading.appendChild(retry);
    const buildUrl = 'Build';
    let gameInstance;
    async function loadVersion() {
      try {
        const response = await fetch('version.json?check=' + Date.now(), { cache: 'no-store' });
        if (!response.ok) throw new Error('version.json returned ' + response.status);
        const manifest = await response.json();
        return manifest && manifest.version ? String(manifest.version) : '';
      } catch (error) {
        loadingHint.textContent = 'Version check unavailable; continuing with cached resources.';
        return localStorage.getItem('StickmanCombatVersion') || '';
      }
    }
    async function startGame() {
      const remoteVersion = await loadVersion();
      const versionQuery = remoteVersion ? '?v=' + encodeURIComponent(remoteVersion) : '';
      const config = {
      dataUrl: buildUrl + '/{{{ DATA_FILENAME }}}' + versionQuery,
      frameworkUrl: buildUrl + '/{{{ FRAMEWORK_FILENAME }}}' + versionQuery,
      codeUrl: buildUrl + '/{{{ CODE_FILENAME }}}' + versionQuery,
#if MEMORY_FILENAME
      memoryUrl: buildUrl + '/{{{ MEMORY_FILENAME }}}' + versionQuery,
#endif
#if SYMBOLS_FILENAME
      symbolsUrl: buildUrl + '/{{{ SYMBOLS_FILENAME }}}' + versionQuery,
#endif
      streamingAssetsUrl: 'StreamingAssets',
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      matchWebGLToCanvasSize: true,
      showBanner: (message, type) => {
        if (type === 'error') { loading.style.display = 'grid'; error.textContent = message; }
        else { console.warn(message); }
      }
    };
    
    function showError(message) {
      loading.style.display = 'grid';
      loadingHint.textContent = 'Check your network, then retry. Cached resources will be reused.';
      retry.style.display = 'block';
      error.textContent = 'Game loading failed. Please retry.\\n' + message;
      document.getElementById('progress').hidden = true;
    }
    const loader = document.createElement('script');
    loader.src = buildUrl + '/{{{ LOADER_FILENAME }}}' + versionQuery;
    loader.onerror = () => showError('Unable to download the Unity loader.');
    loader.onload = () => {
      createUnityInstance(canvas, config, progress => {
        document.getElementById('progress').value = progress;
        loadingHint.textContent = progress < 0.8 ? 'First load may take longer; resources are cached locally.' : 'Initializing game...';
      }).then(instance => {
        gameInstance = instance;
        loading.style.display = 'none';
        fullscreen.disabled = false;
        canvas.focus();
        localStorage.setItem('StickmanCombatLoaded', '1');
        if (remoteVersion) localStorage.setItem('StickmanCombatVersion', remoteVersion);
      }).catch(showError);
    };
    document.body.appendChild(loader);
    }
    startGame().catch(showError);
    fullscreen.addEventListener('click', () => {
      if (!gameInstance) return;
      const request = document.getElementById('game').requestFullscreen;
      if (request) {
        request.call(document.getElementById('game')).catch(() => gameInstance.SetFullscreen(1));
      } else {
        gameInstance.SetFullscreen(1);
      }
      canvas.focus();
      if (screen.orientation && screen.orientation.lock && document.fullscreenElement)
        screen.orientation.lock('landscape').catch(() => {});
    });
    document.addEventListener('fullscreenchange', () => {
      fullscreen.hidden = !!document.fullscreenElement;
    });
    canvas.addEventListener('contextmenu', event => event.preventDefault());
  </script>
</body>
</html>
